[package]
name = "ticktick-tui"
version = "0.1.0"
edition = "2024"
description = "A minimal, Vim-inspired TickTick terminal client"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
directories = "6"
ratatui = "0.29"
pulldown-cmark = "0.13"
chrono = "0.4"
chrono-tz = "0.10"
unicode-width = "0.2"
unicode-segmentation = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[dev-dependencies]
